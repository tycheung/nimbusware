# Meta-campaign: self-evolve via harness research + diverse repos + domain study + distill.
# Operator intent: "Self evolve… accounting software" / study harnesses / diverse projects
workflow_profile: campaign_self_evolve

campaign:
  enabled: true
  autonomous_default: true
  driver:
    tick_idle_seconds: 2
    max_consecutive_failures: 8

backlog:
  generator: heuristic
  max_slices: 200
  require_backlog_approval: false

slice:
  enabled: true
  max_files: 3
  max_loc: 120
  allowed_globs:
    - "**/*.py"
    - "**/*.md"
    - ".nimbusware/evolution/**"
  e2e:
    enabled: false

maintenance:
  refactor_every_n_slices: 8
  architecture_every_n_slices: 12
  refactor_inserts_fix_slices: true
  architecture_can_revise_backlog: true

# Curriculum mix: harness meta-research + diverse repos + domain keywords + distill.
# When domain_keywords are present on the run, research_domain is boosted; else dropped.
self_evolve:
  enabled: true
  council_every_n_slices: 2
  min_autopilot: 8
  mix:
    research_harness: 0.25
    try_diverse_repo: 0.2
    research_domain: 0.35
    distill_artifacts: 0.2

completion:
  require_project_tests_pass: false
  require_all_must_have_features: false
  deep_eval_every_n_slices: 10

stage_graph:
  - stage_name: plan
  - stage_name: slice.plan
    depends_on: [plan]
  - stage_name: slice.implement
    depends_on: [slice.plan]
  - stage_name: slice.verify
    depends_on: [slice.implement]
  - stage_name: slice.critique
    depends_on: [slice.verify]
  - stage_name: slice.test
    depends_on: [slice.critique]
  - stage_name: slice.e2e
    depends_on: [slice.test]
  - stage_name: slice.gate
    depends_on: [slice.e2e]

universal_critique:
  default_enabled: true
  unanimous_gate_enforce: true

integrator_gate:
  enabled: false

agent_evaluator:
  enabled: false

theater:
  enabled: true
  max_message_chars: 1200
  show_evidence_links: true
  llm_summary: false

memory:
  retrieval_enabled: true
  index_contribution: true
  retrieval_k: 8
  excerpt_max_chars: 2000
  embedding_mode: deterministic
